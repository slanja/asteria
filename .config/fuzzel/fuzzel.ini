[main]
font=JetBrainsMono Nerd Font:size=11
prompt="run: "
icon-theme=hicolor
tabs=4
horizontal-pad=24       
vertical-pad=24         
inner-pad=10           

width=50                
lines=10                
line-height=28          
fields=name,generic,exec

[colors]
# Format: RRGGBBAA (Earthy Slate Gray Palette)
background=2a2b2fff     # Main window background
text=e6dfd5ff           # Unselected text color
prompt=96ab95ff         # Prompt prefix color (Earthy Green)
placeholder=697767ff    # Search placeholder color
input=e6dfd5ff          # Active typing text color

# Selection coloring (Active green bar with dark text)
selection=96ab95ff      # Background of the selected row
selection-text=1e1f22ff # Text color of the selected row
selection-match=1e1f22ff # Color of matching characters in selection

border=4e5d4cff         # Border color around the window

[border]
width=2
# INCREASED RADIUS: This automatically makes the selection bar look like a rounded pill
radius=26
